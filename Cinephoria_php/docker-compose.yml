services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinephoria-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      # variables passées au PHP/Apache (et récupérables via getenv()/$_ENV)
      APP_ENV: local
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cinephoria
      DB_USERNAME: cinephoria
      DB_PASSWORD: cinephoria
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cinephoria-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cinephoria
      MYSQL_USER: cinephoria
      MYSQL_PASSWORD: cinephoria
    command: ["--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./Cinephoria_php/cinephoria.sql:/docker-entrypoint-initdb.d/01_cinephoria.sql:ro

volumes:
  dbdata: